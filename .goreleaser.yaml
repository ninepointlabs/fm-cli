version: 2

project_name: fm-cli

before:
  hooks:
    - go mod verify

builds:
  - main: ./cmd/fm-cli
    binary: fm-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: packages
    package_name: fm-cli
    vendor: Ninepoint Labs
    homepage: https://github.com/ninepointlabs/fm-cli
    maintainer: Ninepoint Labs <tim@ninepointlabs.com>
    description: Terminal-based TUI for Fastmail
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/fm-cli/LICENSE
      - src: README.md
        dst: /usr/share/doc/fm-cli/README.md

